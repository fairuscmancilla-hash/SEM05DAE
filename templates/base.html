<!DOCTYPE html>
{% load static %}
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Movies{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{% static 'movies/style.css' %}" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{% url 'movies:movie_list' %}">Movies</a>
    <nav>
      <a href="{% url 'admin:index' %}">Panel</a>
      {% if user.is_authenticated %}
        <span class="user">{{ user.get_username }}</span>
        <form action="{% url 'logout' %}" method="post" class="inline-form">
          {% csrf_token %}
          <button type="submit">Salir</button>
        </form>
      {% else %}
        <a href="{% url 'login' %}">Ingresar</a>
      {% endif %}
    </nav>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
